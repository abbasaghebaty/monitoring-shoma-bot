name = "monitoring-shoma-bot"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
OWNER_ID = "602217153"
ADMIN_IDS = "602217153"
TIMEZONE = "Asia/Tehran"

[[d1_databases]]
binding = "DB"
database_name = "shop-manager"
database_id = "4e406079-a02f-4412-9167-57ca03b29f85"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "f71b071ac7e6495a869c748cbcab4ed5"

# Secret:
# npx wrangler secret put BOT_TOKEN


# گزارش پایان ماه شمسی هر روز در 20:29 UTC اجرا می‌شود؛
# کد فقط در ساعت 23:59 تهران و در آخرین روز ماه شمسی پیام می‌فرستد.
[triggers]
crons = ["29 20 * * *"]
